# Android OpenSSL static build (SDK-066) + native/host tests + Gradle AAR (SDK-030).
name: android

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  openssl-android-static:
    name: Build OpenSSL static (Android ABIs)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Pinned with Android module (SDK-030 / docs/toolchain.md). Gate H-2 on PR.
      NDK_VERSION: r29
      ANDROID_API: '26'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y perl make build-essential

      - name: Setup Android NDK (pinned ≥ r28)
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          link-to-sdk: false

      - name: Verify OpenSSL source present
        run: |
          test -f third_party/openssl/Configure
          test -f third_party/SOURCE_MANIFEST.json
          python3 - <<'PY'
          import json
          m=json.load(open("third_party/SOURCE_MANIFEST.json"))
          o=next(c for c in m["components"] if c["component"]=="openssl")
          assert o["commit"]=="f4dc4d58b48d346a8270183f89acf826d459b0ca"
          assert o["version"]=="openssl-3.5.8"
          assert o["archiveSha256"]
          print("openssl pin OK", o["version"], o["commit"][:12])
          PY

      - name: Build static OpenSSL for Android ABIs
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          chmod +x scripts/build-openssl-android.sh
          scripts/build-openssl-android.sh
          echo "==== SHA256SUMS ===="
          cat build/openssl-android/SHA256SUMS
          # Assert no shared libs
          if find build/openssl-android -name 'libssl.so*' -o -name 'libcrypto.so*' | grep -q .; then
            echo "Shared OpenSSL libs found — failing" >&2
            exit 1
          fi
          test -f build/openssl-android/arm64-v8a/lib/libssl.a
          test -f build/openssl-android/armeabi-v7a/lib/libssl.a
          test -f build/openssl-android/x86_64/lib/libssl.a
          test -f build/openssl-android/arm64-v8a/lib/libcrypto.a
          test -f build/openssl-android/armeabi-v7a/lib/libcrypto.a
          test -f build/openssl-android/x86_64/lib/libcrypto.a

      - name: Package artifact (static libs + checksums only)
        run: |
          rm -rf build/openssl-android/build-*
          test -f build/openssl-android/SHA256SUMS
          test -f build/openssl-android/ARTIFACT_META.json

      - name: Upload OpenSSL Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: openssl-android-${{ github.sha }}
          path: build/openssl-android/
          if-no-files-found: error
          retention-days: 30

  # SDK-009: static libre.a + libbaresip.a + stub libomnix_voice via NDK
  native-android-arm64:
    name: Native static (android-arm64)
    needs: openssl-android-static
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NDK_VERSION: r29
      ANDROID_API: '26'
      ABI: arm64-v8a
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake

      - name: Setup Android NDK (pinned ≥ r28)
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          link-to-sdk: false

      - name: Download OpenSSL Android artifact
        uses: actions/download-artifact@v4
        with:
          name: openssl-android-${{ github.sha }}
          path: build/openssl-android

      - name: Build libre.a + libbaresip.a (arm64-v8a)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          test -f "build/openssl-android/${ABI}/lib/libssl.a"
          test -f "build/openssl-android/${ABI}/lib/libcrypto.a"
          chmod +x scripts/build-native-android.sh
          scripts/build-native-android.sh
          # Acceptance: static archives present; third_party untouched by build
          test -n "$(find build/android-${ABI} -name 'libre.a' -o -name 're.a' | head -n1)"
          test -n "$(find build/android-${ABI} -name 'libbaresip.a' -o -name 'baresip.a' | head -n1)"
          test -f cpp/include/omnix_voice/omnix_voice.h
          test -f cpp/include/omnix_voice/omnix_types.h
          test -f cpp/src/omnix_voice.c
          test -f cpp/CMakeLists.txt

      - name: API leakage check
        run: |
          chmod +x scripts/check-api-leakage.sh
          scripts/check-api-leakage.sh

  # SDK-030: Gradle Android library → libomnixvoice.so for 3 ABIs
  android-gradle-release:
    name: Android Gradle assembleRelease (3 ABIs)
    needs: openssl-android-static
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NDK_VERSION: r29
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # v3 default includes obsolete `tools` (removed from sdkmanager); platform-tools only.
          packages: platform-tools

      - name: Install platform + build-tools + CMake + NDK pin
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;29.0.14206865"
          # setup-ndk also acceptable; pin side-by-side path for AGP ndkVersion
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Download OpenSSL Android artifact
        uses: actions/download-artifact@v4
        with:
          name: openssl-android-${{ github.sha }}
          path: build/openssl-android

      - name: Verify OpenSSL + shipped-native allowlist
        run: |
          test -f build/openssl-android/arm64-v8a/lib/libssl.a
          test -f build/openssl-android/armeabi-v7a/lib/libssl.a
          test -f build/openssl-android/x86_64/lib/libssl.a
          test -f android/shipped-native-libs.txt
          grep -qx 'libomnixvoice.so' android/shipped-native-libs.txt
          test "$(grep -cve '^[[:space:]]*$' android/shipped-native-libs.txt)" = "1"

      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Gradle assembleRelease
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify OmnixVoiceSDK-x.y.z.aar contents (SDK-036)
        run: |
          set -euo pipefail
          # Exact versioned name only (ignore any stale *-release.aar leftovers).
          shopt -s nullglob
          AARS=(android/build/outputs/aar/OmnixVoiceSDK-[0-9]*.[0-9]*.[0-9]*.aar)
          (( ${#AARS[@]} == 1 )) || {
            echo "FAIL: expected exactly one OmnixVoiceSDK-x.y.z.aar, found: ${AARS[*]:-none}"
            ls -la android/build/outputs/aar/ || true
            exit 1
          }
          AAR="${AARS[0]}"
          echo "AAR=$AAR"
          basen=$(basename "$AAR")
          [[ "$basen" =~ ^OmnixVoiceSDK-[0-9]+\.[0-9]+\.[0-9]+\.aar$ ]] \
            || { echo "FAIL: AAR name must be OmnixVoiceSDK-x.y.z.aar (got $basen)"; exit 1; }
          unzip -l "$AAR"
          # SDK-037 — shared ABI verify script (identical semantics to verify-abi.ps1)
          chmod +x scripts/verify-abi.sh
          scripts/verify-abi.sh "$AAR"
          # SDK-038 — every .so PT_LOAD / GNU_RELRO 16 KB check (pinned NDK llvm-readelf)
          export ANDROID_NDK_HOME="${ANDROID_SDK_ROOT}/ndk/29.0.14206865"
          test -x "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          chmod +x scripts/verify-16kb-alignment.sh
          scripts/verify-16kb-alignment.sh "$AAR"
          unzip -l "$AAR" | grep -q 'classes\.jar' \
            || { echo "FAIL: missing classes.jar"; exit 1; }
          unzip -l "$AAR" | grep -q 'AndroidManifest\.xml' \
            || { echo "FAIL: missing AndroidManifest.xml"; exit 1; }
          # Notices as asset or META-INF (SDK-036)
          unzip -l "$AAR" | grep -E 'assets/THIRD_PARTY_NOTICES\.md|META-INF/THIRD_PARTY_NOTICES\.md' \
            || { echo "FAIL: missing THIRD_PARTY_NOTICES.md in AAR"; exit 1; }
          echo "OK: THIRD_PARTY_NOTICES.md packaged"
          # No unexpected .so (allowlist = libomnixvoice.so only)
          SOS=$(unzip -l "$AAR" | awk '/\.so$/ {print $NF}')
          echo "shipped .so entries:"
          echo "$SOS"
          while IFS= read -r so; do
            [[ -z "$so" ]] && continue
            base=$(basename "$so")
            if [[ "$base" != "libomnixvoice.so" ]]; then
              echo "FAIL: unexpected native lib $so"
              exit 1
            fi
          done <<< "$SOS"
          echo "PASS: OmnixVoiceSDK-x.y.z.aar — three ABIs, classes.jar, manifest, notices, allowlist only"

      - name: Upload release AAR
        uses: actions/upload-artifact@v4
        with:
          name: omnix-voice-aar-${{ github.sha }}
          path: android/build/outputs/aar/OmnixVoiceSDK-[0-9]*.[0-9]*.[0-9]*.aar
          if-no-files-found: error
          retention-days: 14

  # SDK-010/011/012/013/014/015/016: host unit tests (Linux canonical)
  native-host-tests:
    name: Native host tests (lifecycle + log redaction + account + registration + events + call model + outgoing + mute + speaker + dtmf + hold + tls + srtp + codecs + stun)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake build-essential libssl-dev zlib1g-dev

      - name: Configure + build host native + tests
        run: |
          cmake -S cpp -B build/host -G Ninja -DSTATIC=ON -DOMNIX_BUILD_TESTS=ON
          cmake --build build/host --target omnix_voice test_log_redaction test_lifecycle test_account test_registration test_registration_events test_call_model test_outgoing_call test_incoming_call test_answer_reject test_hangup test_mute test_speaker test_dtmf test_hold test_tls test_srtp test_codecs test_stun -j"$(nproc)"

      - name: Run log redaction unit test
        run: |
          ./build/host/test_log_redaction

      - name: Run lifecycle unit test
        run: |
          ./build/host/test_lifecycle

      - name: Run account model unit test
        run: |
          ./build/host/test_account

      - name: Run registration unit test
        run: |
          ./build/host/test_registration

      - name: Run registration events unit test
        run: |
          ./build/host/test_registration_events

      - name: Run call model unit test
        run: |
          ./build/host/test_call_model

      - name: Run outgoing call unit test
        run: |
          ./build/host/test_outgoing_call

      - name: Run incoming call unit test
        run: |
          ./build/host/test_incoming_call

      - name: Run answer/reject unit test
        run: |
          ./build/host/test_answer_reject

      - name: Run hangup unit test
        run: |
          ./build/host/test_hangup

      - name: Run mute unit test
        run: |
          ./build/host/test_mute

      - name: Run speaker unit test
        run: |
          ./build/host/test_speaker

      - name: Run DTMF unit test
        run: |
          ./build/host/test_dtmf

      - name: Run hold/resume unit test
        run: |
          ./build/host/test_hold

      - name: Run TLS unit test
        run: |
          ./build/host/test_tls

      - name: Run SRTP unit test
        run: |
          ./build/host/test_srtp

      - name: Run codecs unit test
        run: |
          ./build/host/test_codecs

      - name: Run STUN unit test
        run: |
          ./build/host/test_stun

      - name: API leakage check
        run: |
          chmod +x scripts/check-api-leakage.sh
          scripts/check-api-leakage.sh
